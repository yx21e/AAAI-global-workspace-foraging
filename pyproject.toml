[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gwt-foraging-scaffold"
version = "0.1.0"
description = "Interface-ready multi-agent global workspace scaffold for foraging simulations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
authors = [
  { name = "yx21e" }
]
keywords = ["global-workspace", "multi-agent", "foraging", "simulation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
foraging = [
  "pygame>=2.5"
]
encoder = [
  "sentence-transformers>=3.0"
]
llm = [
  "openai>=1.93.0"
]
hf = [
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=4.57.0",
  "accelerate>=1.0",
  "pillow>=10.0",
  "huggingface-hub>=0.25",
]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
